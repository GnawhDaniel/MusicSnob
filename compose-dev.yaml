services:
  web:
    build:
      context: ./client/
      target: dev
    ports:
      - "5000:5173"
    depends_on:
      - server
    environment:
      - API_BASE_URL=http://server:5001/api/web/v1
      - HOST=0.0.0.0
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./client/app:/app/app/

  server:
    build: 
      context: .
      target: dev
    ports:
      - "5001:5001"
    volumes:
      - ./db/data.db:/code/db/data.db:rw
      - ./assets/thumbnails:/code/assets/thumbnails/
      - ./engine:/code/engine/
      - ./internal:/code/internal/