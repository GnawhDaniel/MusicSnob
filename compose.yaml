services:
  web:
    build: ./client/
    ports:
      - "5000:5000"
    depends_on:
      - server
    environment:
      - API_BASE_URL=http://server:5001/api/web/v1
      - HOST=0.0.0.0
      - PORT=5000
      - PYTHONUNBUFFERED=1
    networks:
      - app

  server:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./db/data.db:/code/db/data.db:rw
      - ./assets/thumbnails:/code/assets/thumbnails/
    networks:
      - app

networks:
  app: